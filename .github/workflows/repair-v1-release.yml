name: One-time v1.0 attribution correction
on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: Temporary download URL for compiled candidate only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: one-time-v1-attribution
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mask temporary download URL
        shell: python
        run: |
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH']) as f: url=json.load(f)['inputs']['candidate_url']
          from urllib.parse import urlparse
          u=urlparse(url)
          assert u.scheme=='https' and u.hostname=='sdmntprwestus2.oaiusercontent.com'
          assert os.environ['GITHUB_REPOSITORY']=='xiaopigjing-arch/epidemic-report-tool'
          print('::add-mask::'+url)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CANDIDATE_URL='+url+'\n')
      - name: Upload exact approved document-only revision
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, json, urllib.request, zipfile, io, hashlib, base64, zlib, subprocess
          from pathlib import Path
          raw=urllib.request.urlopen(os.environ['CANDIDATE_URL'],timeout=120).read()
          assert hashlib.sha256(raw).hexdigest()=='1ac13f8e21ed6761b9e8a3db799cd0777c085160c4a191a4871bdb13cfc275fc'
          with zipfile.ZipFile(io.BytesIO(raw)) as z: raw=z.read('疫情监测报告助手_v1.0.zip')
          assert hashlib.sha256(raw).hexdigest()=='73bfba5da14617b432a6e4b999efae279437838a3e23cedf6e6513ca463b407a'
          with zipfile.ZipFile(io.BytesIO(raw)) as z: files={n.split('/',1)[1]:z.read(n) for n in z.namelist()}
          changes=json.loads(zlib.decompress(base64.b64decode('')))
          for n,v in changes.items(): files[n]=base64.b64decode(v)
          files.pop('第三方许可/Nuitka-nuitka_reports_LicenseReport.rst.j2')
          for n in ['SHA256SUMS.txt','文件清单.txt']: files.pop(n,None)
          files['文件清单.txt']=(''.join(f'{n}\t{len(files[n])} bytes\n' for n in sorted(files))+'本清单不列自身及SHA256清单。\n').encode()
          files['SHA256SUMS.txt']=''.join(f'{hashlib.sha256(files[n]).hexdigest()}  {n}\n' for n in sorted(files)).encode()
          assert len(files)==1028
          p=Path('EpiReport_v1.0.zip')
          with zipfile.ZipFile(p,'w') as z:
           for n in sorted(files):
            info=zipfile.ZipInfo('疫情监测报告助手_v1.0/'+n,(2026,10,27,14,6,42));info.create_system=3;info.external_attr=2175008768
            z.writestr(info,files[n],compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert h=='6d4b32eca1ca36c041ea9e29eeced46924c78553d19cac84846808238a405d56',h
          Path(p.name+'.sha256').write_text(h+'  '+p.name+'\n')
          repo='xiaopigjing-arch/epidemic-report-tool'
          subprocess.run(['gh','release','upload','v1.0',str(p),str(p)+'.sha256','--clobber','--repo',repo],check=True)
          notes=subprocess.check_output(['gh','api','repos/'+repo+'/releases/tags/v1.0','--jq','.body'],text=True).replace('26,801,838','26,801,853').replace('5203c75b4065d900512586510789ec3da0a93af550ae68a1d1b1da3bf6a49b5f',h)
          Path('notes.md').write_text(notes)
          subprocess.run(['gh','release','edit','v1.0','--notes-file','notes.md','--repo',repo],check=True)
          print('PASS: exact approved package uploaded; runtime unchanged; SHA256 '+h)
